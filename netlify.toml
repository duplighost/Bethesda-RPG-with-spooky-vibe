# HALLOWIND is a static site — no build step. Netlify serves the files as-is.
[build]
  publish = "."
  command = ""

# Ensure ES modules + the vendored Three.js are served with a JS MIME type.
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app's own source must always revalidate, so a redeploy is never served
# stale from the browser cache (the cause of "it still has the old bug").
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
