# HALLOWIND is a static site — no build step. Netlify serves the files as-is.
[build]
  publish = "."
  command = ""

# Ensure ES modules + the vendored Three.js are served with a JS MIME type.
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
